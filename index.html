<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shanvez</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #050505;
            color: #f2f2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, "Times New Roman", serif;
            overflow: hidden;
        }

        .center {
            text-align: center;
            transform: translateY(-2%);
        }

        .name {
            font-size: clamp(70px, 13vw, 150px);
            font-weight: 400;
            letter-spacing: -4px;
            line-height: 1;
            margin: 0;
        }

        .subtitle {
            margin-top: 12px;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #333;
        }

        .write {
            margin-top: 55px;
            font-size: clamp(28px, 5vw, 50px);
            font-weight: 400;
            letter-spacing: 2px;
        }

        .chat {
            margin-top: 55px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            color: #777;
        }
    </style>
</head>

<body>

    <main class="center">

        <h1 class="name">Shanvez</h1>

        <div class="subtitle">
            Prodigy (Proclaimed)
        </div>

        <div class="write">
            i am, therefore i write
        </div>

        <div class="chat">
            am i live chat?
        </div>

    </main>

</body>
</html>
